<!doctype html>
<html>
  <head>
    <title>NTL VANCED</title>
    <script src="popup.js"></script>
<style>
.myPlayButton,
.myrtlButton,
.myhelpButton {
    display: block;
    margin: 6px auto;
    width: 180px;
    padding: 6px 0 7px;
    border: 1px solid rgba(0, 0, 0, 0.45);
    border-radius: 14px;
    color: white;
    font: inherit;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -2px 3px rgba(0, 0, 0, 0.30),
        0 1px 1px rgba(0, 0, 0, 0.35),
        0 2px 4px rgba(0, 0, 0, 0.25);
    transition: transform 80ms ease, box-shadow 80ms ease, filter 120ms ease;
}
.myPlayButton:hover,
.myrtlButton:hover,
.myhelpButton:hover {
    filter: brightness(1.08);
}
.myPlayButton:active,
.myrtlButton:active,
.myhelpButton:active {
    transform: translateY(1px);
    box-shadow:
        inset 0 1px 2px rgba(0, 0, 0, 0.35),
        0 1px 1px rgba(0, 0, 0, 0.25);
}
.myPlayButton {
    background: linear-gradient(180deg, #ff5a5a 0%, #e01e1e 55%, #a80909 100%);
}
.myrtlButton {
    background: linear-gradient(180deg, #6cd47a 0%, #3aa84a 55%, #217c30 100%);
}
.myhelpButton {
    background: linear-gradient(180deg, #ffd46b 0%, #f2b200 55%, #b98a00 100%);
}
html, body {
    margin: 0;
    padding: 0;
    background: #151515;
}
body {
    padding: 6px;
    width: 234px;
    box-sizing: border-box;
}
.panel {
    position: relative;
    border-radius: 14px;
    padding: 6px 6px 8px;
    text-align: center;
    background:
        linear-gradient(180deg, #b8b8b8 0%, #8a8a8a 55%, #707070 100%);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 1px 0 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(0, 0, 0, 0.35),
        inset -1px 0 0 rgba(0, 0, 0, 0.25),
        inset 0 -8px 14px -8px rgba(0, 0, 0, 0.35),
        0 2px 4px rgba(0, 0, 0, 0.55),
        0 6px 12px rgba(0, 0, 0, 0.35);
    color: #111;
}
.panel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background:
        radial-gradient(120% 60% at 50% -10%,
                        rgba(255, 255, 255, 0.35) 0%,
                        rgba(255, 255, 255, 0)   55%);
    pointer-events: none;
}
.panel > * {
    position: relative;
}
</style>
  </head>
  <body>
    <div class="panel">
      <canvas id="ntl-title" width="218" height="54" role="img" aria-label="NTL MOD" style="display:block;margin:4px auto 2px;">NTL MOD</canvas>
      <button class="myPlayButton" id="checkPage">Play slither.io</button>
      <button class="myrtlButton" id="rtl">Leaderboards</button>
      <button class="myhelpButton" id="help">Help</button>
      <center><p style="margin:6px 0 2px;">NTL MOD version <span id="nmv"></span></p></center>
      <div id="ntl-status" style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#111;margin:0 0 4px;">
        <span id="ntl-status-dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#888;box-shadow:inset 0 1px 1px rgba(255,255,255,0.5),0 0 2px rgba(0,0,0,0.45);"></span>
        <span id="ntl-status-text">checking…</span>
      </div>
    </div>
  </body>
</html>
